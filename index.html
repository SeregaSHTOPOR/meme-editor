<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Редактор мемов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Lobster&family=Montserrat:wght@800&family=Pacifico&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--tg-theme-secondary-bg-color, #222222);
      color: var(--tg-theme-text-color, #fff);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
    .upload-btn {
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .tags-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tags-bar::-webkit-scrollbar {
      display: none;
    }
    .tag {
      padding: 4px 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      color: #bbb;
      user-select: none;
    }
    .tag.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: #fff;
    }
    .templates-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      min-height: 64px;
    }
    .templates-bar::-webkit-scrollbar {
      display: none;
    }
    .thumb {
      width: 62px;
      height: 62px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      background: #2a2a2a;
      transition: transform 0.15s, border-color 0.15s;
    }
    .thumb.active {
      border-color: var(--tg-theme-button-color, #2481cc);
      transform: scale(1.06);
    }
    .no-results {
      font-size: 12px;
      color: #888;
      padding: 10px 4px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    canvas {
      max-width: 100%;
      max-height: 48vh;
      display: block;
      touch-action: none;
      cursor: move;
    }
    .drag-hint {
      text-align: center;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #888);
      margin-top: -4px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--tg-theme-secondary-bg-color, #202020);
      padding: 12px 14px;
      border-radius: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tg-theme-hint-color, #999);
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #fff);
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select {
      flex: 1.2;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #fff);
      font-size: 13px;
      outline: none;
    }
    .color-picker {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .color-dot.active {
      border-color: #fff;
      transform: scale(1.18);
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--tg-theme-button-color, #2481cc);
    }
    .toggles-row {
      display: flex;
      gap: 6px;
    }
    .toggle-btn {
      flex: 1;
      padding: 7px 4px;
      background: var(--tg-theme-bg-color, #141414);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #ccc;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .toggle-btn.active {
      background: var(--tg-theme-button-color, #2481cc);
      border-color: var(--tg-theme-button-color, #2481cc);
      color: #fff;
    }
    .main-btn {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(36, 129, 204, 0.4);
      margin-top: 2px;
    }
    .main-btn:active {
      transform: scale(0.98);
    }
    .extra-btns-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .secondary-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: var(--tg-theme-text-color, #ffffff);
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .secondary-btn:active {
      transform: scale(0.97);
    }

    /* Окно «Поделиться» (Share Modal) в стиле скриншота */
    .share-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 99999;
      animation: fadeIn 0.2s ease;
    }
    .share-modal-overlay.active {
      display: flex;
    }
    .share-modal {
      width: 100%;
      max-width: 480px;
      background: #1c1c1e;
      border-radius: 22px 22px 0 0;
      padding: 20px 18px 26px;
      box-shadow: 0 -6px 32px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .share-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .share-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .share-modal-close {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #aaa;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .share-modal-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.22);
    }
    .share-icons-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 4px;
      gap: 4px;
    }
    .share-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s;
      flex: 1;
    }
    .share-item:active {
      transform: scale(0.9);
    }
    .share-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }
    .share-item:hover .share-icon {
      transform: translateY(-2px);
    }
    .tg-icon { background: #2AABEE; }
    .wa-icon { background: #25D366; }
    .vk-icon { background: #0077FF; }
    .viber-icon { background: #7360F2; }
    .more-icon { background: #444446; }
    .share-item span {
      font-size: 12px;
      color: #ddd;
      font-weight: 500;
    }
    .share-toast {
      background: rgba(46, 204, 113, 0.22);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .share-actions-box {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 2px;
    }
    .share-action-btn {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .share-action-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.25);
    }
    .share-action-btn:active {
      transform: scale(0.98);
    }
    .share-action-btn.primary {
      background: var(--tg-theme-button-color, #2481cc);
      border-color: var(--tg-theme-button-color, #2481cc);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Поиск и загрузка фото -->
    <div class="header-bar">
      <input type="text" class="search-input" id="searchBar" placeholder="🔎 Ищи: кот, собака, дрейк, работа...">
      <label class="upload-btn" for="fileInput">📁 Своё фото</label>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <!-- Быстрые теги тем -->
    <div class="tags-bar">
      <div class="tag active" data-tag="all">🔥 Все популярные</div>
      <div class="tag" data-tag="cat">🐱 Коты</div>
      <div class="tag" data-tag="dog">🐶 Доге</div>
      <div class="tag" data-tag="choice">🎭 Выбор / Дрейк</div>
      <div class="tag" data-tag="think">🧠 Мысли / Сверхразум</div>
      <div class="tag" data-tag="work">💼 Работа / IT</div>
      <div class="tag" data-tag="sad">😭 Боль / Грусть</div>
    </div>

    <!-- Лента миниатюр мемов -->
    <div class="templates-bar" id="templatesBar"></div>

    <!-- Холст редактора -->
    <div class="canvas-wrapper">
      <canvas id="memeCanvas"></canvas>
    </div>
    <div class="drag-hint">👆 Перетаскивай надпись пальцем или мышкой прямо по картинке!</div>

    <!-- Пульт настроек текста -->
    <div class="controls">
      <div class="input-group">
        <label>Текст на меме (со смайликами 😂🔥)</label>
        <input type="text" id="memeText" placeholder="Введи текст мема..." value="КОГДА ВСЁ РАБОТАЕТ ИДЕАЛЬНО 🔥">
      </div>

      <div class="row">
        <div class="input-group" style="flex: 1.2;">
          <label>Шрифт</label>
          <select id="fontSelect">
            <option value="Impact" selected>Impact (Мемы)</option>
            <option value="Montserrat">Montserrat (Жирный)</option>
            <option value="Comic Neue">Comic Sans (Юмор)</option>
            <option value="Lobster">Lobster (Красивый)</option>
            <option value="Pacifico">Pacifico (Элегантный)</option>
            <option value="Times New Roman">Times (Классика)</option>
            <option value="Roboto">Roboto (Чистый)</option>
          </select>
        </div>
        <div class="input-group" style="flex: 1;">
          <label>Размер: <span id="sizeVal">38px</span></label>
          <input type="range" id="fontSize" min="18" max="95" value="38">
        </div>
      </div>

      <div class="input-group">
        <label>Цвет текста</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
          <div class="color-dot" style="background: #ffeb00;" data-color="#ffeb00"></div>
          <div class="color-dot" style="background: #ff3b30;" data-color="#ff3b30"></div>
          <div class="color-dot" style="background: #34c759;" data-color="#34c759"></div>
          <div class="color-dot" style="background: #00c7be;" data-color="#00c7be"></div>
          <div class="color-dot" style="background: #af52de;" data-color="#af52de"></div>
          <div class="color-dot" style="background: #111111; border: 1px solid #666;" data-color="#111111"></div>
        </div>
      </div>

      <div class="toggles-row">
        <div class="toggle-btn active" id="btnStroke">🔲 Контур</div>
        <div class="toggle-btn" id="btnPlate">🏷 Плашка</div>
        <div class="toggle-btn active" id="btnUpper">🔠 КАПС</div>
      </div>

      <button class="main-btn" id="btnSubmit">📤 Поделиться / Отправить мем</button>
      <div class="extra-btns-row">
        <button class="secondary-btn" id="btnDownload">💾 Скачать файл</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно «Поделиться» (в стиле скриншота VK/приложений) -->
  <div class="share-modal-overlay" id="shareModal">
    <div class="share-modal">
      <div class="share-modal-header">
        <span class="share-modal-title">Поделиться</span>
        <button class="share-modal-close" id="shareCloseBtn">✕</button>
      </div>

      <!-- Иконки соцсетей и мессенджеров -->
      <div class="share-icons-grid">
        <div class="share-item" id="shareTgBtn">
          <div class="share-icon tg-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          </div>
          <span>Telegram</span>
        </div>

        <div class="share-item" id="shareWaBtn">
          <div class="share-icon wa-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M16.75 13.96c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.59.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3zm-4.72 6.78c-1.88 0-3.64-.51-5.16-1.41L3 20.33l1.04-3.77A9.45 9.45 0 012.59 12c0-5.21 4.24-9.45 9.45-9.45 2.53 0 4.9 1 6.69 2.78A9.39 9.39 0 0121.5 12c0 5.21-4.24 9.45-9.45 9.45zm7.39-16.14A10.37 10.37 0 0012.03.56C5.71.56.56 5.71.56 12.03c0 2.02.53 3.99 1.53 5.72L.03 23.97l6.38-1.67a11.4 11.4 0 005.62 1.46h.01c6.32 0 11.47-5.15 11.47-11.47 0-3.07-1.19-5.95-3.37-8.13z"/></svg>
          </div>
          <span>WhatsApp</span>
        </div>

        <div class="share-item" id="shareVkBtn">
          <div class="share-icon vk-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M15.684 0H8.316C3.592 0 0 3.592 0 8.316v7.368C0 20.408 3.592 24 8.316 24h7.368C20.408 24 24 20.408 24 15.684V8.316C24 3.592 20.408 0 15.684 0zm4.015 17.395h-2.115c-.802 0-1.048-.636-2.493-2.079-1.258-1.22-1.819-1.378-2.133-1.378-.441 0-.568.126-.568.736v1.942c0 .524-.168.779-1.551.779-2.289 0-4.831-1.391-6.621-3.987-2.697-3.83-3.442-6.708-3.442-7.307 0-.326.126-.628.736-.628h2.115c.546 0 .756.252.966.84.987 2.877 2.646 5.397 3.328 5.397.252 0 .368-.116.368-.756V10.15c-.105-1.344-.788-1.46-.788-1.943 0-.231.189-.462.504-.462h3.328c.462 0 .63.242.63.788v4.253c0 .462.2.62.336.62.273 0 .504-.158 1.029-.683 1.585-1.785 2.719-4.431 2.719-4.431.147-.326.4-.588.945-.588h2.115c.651 0 .798.336.651.788-.262.882-2.342 4.085-2.457 4.316-.252.4-.346.588 0 1.05.252.347 1.092 1.071 1.648 1.722 1.029 1.187 1.827 2.184 2.047 2.877.22.693-.116 1.04-.766 1.04z"/></svg>
          </div>
          <span>VK</span>
        </div>

        <div class="share-item" id="shareViberBtn">
          <div class="share-icon viber-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M19.78 15.65c-.71-.41-1.47-.79-2.2-1.12-.44-.2-.93-.05-1.2.35l-.83 1.25c-.24.36-.67.49-1.07.31-2.15-.96-3.85-2.66-4.81-4.81-.18-.4-.05-.83.31-1.07l1.25-.83c.4-.27.55-.76.35-1.2-.33-.73-.71-1.49-1.12-2.2-.28-.49-.87-.69-1.38-.47L7.6 6.47c-.52.22-.88.7-.93 1.26-.29 3.44 1.17 6.89 3.9 9.62 2.73 2.73 6.18 4.19 9.62 3.9.56-.05 1.04-.41 1.26-.93l.81-2.29c.22-.51.02-1.1-.48-1.38z"/></svg>
          </div>
          <span>Viber</span>
        </div>

        <div class="share-item" id="shareSystemBtn">
          <div class="share-icon more-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
          </div>
          <span>Еще</span>
        </div>
      </div>

      <!-- Всплывающая подсказка -->
      <div class="share-toast" id="shareToast"></div>

      <!-- Действия под иконками -->
      <div class="share-actions-box">
        <button class="share-action-btn primary" id="shareCopyImgBtn">
          📋 Скопировать картинку (Ctrl+V в чат)
        </button>
        <button class="share-action-btn" id="shareDownloadBtn">
          💾 Скачать мем на устройство
        </button>
        <button class="share-action-btn" id="shareBotBtn">
          🤖 Отправить через бота в чат
        </button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Богатая встроенная база шаблонов с русскими поисковыми тегами
    let allTemplates = [
      // Коты и животные
      { id: "cat_rybov", title: "Вы продаете рыбов", tags: "рыбов кот коты котик рыба продаете кошка", cat: "cat", url: "https://i.imgflip.com/1g8my4.jpg" },
      { id: "cat_woman", title: "Женщина кричит на кота за столом", tags: "кот кошка стол женщина кричит белая салат орет", cat: "cat", url: "https://i.imgflip.com/345v97.jpg" },
      { id: "cat_sad", title: "Грустный плачущий котик", tags: "кот котик плачет слезы грусть печаль", cat: "cat", url: "https://i.imgflip.com/46hhvr.jpg" },
      { id: "doge", title: "Доге (Doge)", tags: "доге собака пес пёс сиба ину мем классика", cat: "dog", url: "https://i.imgflip.com/4t0m5.jpg" },
      { id: "buff_doge", title: "Качок Доге и Чимс", tags: "доге чимс собака качок раньше сейчас сравнение слабый сильный", cat: "dog", url: "https://i.imgflip.com/43a45p.jpg" },
      { id: "this_is_fine", title: "Собака в огне (This is fine)", tags: "собака огонь пожар все нормально пёс чай кофе", cat: "dog", url: "https://i.imgflip.com/wxica.jpg" },

      // Выбор и реакции
      { id: "drake", title: "Дрейк (Drake)", tags: "дрейк выбор нет да одобряет отвергает рэпер", cat: "choice", url: "https://i.imgflip.com/30b1gx.jpg" },
      { id: "two_buttons", title: "Две кнопки (Сложный выбор)", tags: "две кнопки выбор паника пот человек мужик красная", cat: "choice", url: "https://i.imgflip.com/1g8my4.jpg" },
      { id: "distracted_bf", title: "Парень оглянулся на девушку", tags: "парень девушка измена оглянулся платье свидание", cat: "choice", url: "https://i.imgflip.com/1ur9b0.jpg" },
      { id: "monkey_puppet", title: "Обезьяна отвернулась", tags: "обезьяна отвернулся стыдно неловко глаза взгляд в сторону", cat: "choice", url: "https://i.imgflip.com/2gnnjh.jpg" },

      // Мысли, ум, работа
      { id: "rollsafe", title: "Думающий парень (Roll Safe)", tags: "думает умный мысль палец у виска голова соображает гений", cat: "think", url: "https://i.imgflip.com/1h7in3.jpg" },
      { id: "expanding_brain", title: "Сверхразум (Расширение мозга)", tags: "мозг мысли сверхразум уровни космос идея", cat: "think", url: "https://i.imgflip.com/1jwhww.jpg" },
      { id: "change_my_mind", title: "Измени мое мнение (Change My Mind)", tags: "стол кофе кружка парк докажи мнение спор", cat: "think", url: "https://i.imgflip.com/24y43o.jpg" },
      { id: "office_same", title: "Найди отличия (The Office)", tags: "офис найди отличия они одинаковые одно и то же девушка", cat: "work", url: "https://i.imgflip.com/2ybua0.jpg" },
      { id: "computer_angry", title: "Злой за компом / Программист", tags: "программист код комп компьютер злой клавиатура работа офис", cat: "work", url: "https://i.imgflip.com/261o3j.jpg" },

      // Эмоции
      { id: "dicaprio", title: "Леонардо Ди Каприо с бокалом", tags: "ди каприо тост бокал вино гэтсби ухмылка праздник", cat: "all", url: "https://i.imgflip.com/39t1o.jpg" },
      { id: "disaster_girl", title: "Девочка на фоне пожара", tags: "девочка пожар улыбка огонь злодейка дом горит", cat: "all", url: "https://i.imgflip.com/23ls.jpg" },
      { id: "pablo_escobar", title: "Ожидающий Пабло Эскобар", tags: "пабло эскобар ждет скучно ожидание тоска один сидит", cat: "sad", url: "https://i.imgflip.com/1c1uej.jpg" },
      { id: "clown", title: "Клоун красится", tags: "клоун макияж цирк дебил дурак позор", cat: "all", url: "https://i.imgflip.com/38el31.jpg" },
      { id: "gigachad", title: "Гигачад (Gigachad)", tags: "гигачад сигма скуф мужик челюсть красивый сила", cat: "all", url: "https://i.imgflip.com/65x7uh.jpg" },
      { id: "batman_slap", title: "Бэтмен бьет Робина", tags: "бэтмен робин пощечина заткнись удар комикс", cat: "all", url: "https://i.imgflip.com/9ehk.jpg" },
      { id: "grumpy_cat", title: "Сердитый кот (Grumpy Cat)", tags: "сердитый кот злой недовольный морда", cat: "cat", url: "https://i.imgflip.com/8p0a.jpg" },
      { id: "success_kid", title: "Успешный ребенок (Success Kid)", tags: "успех ребенок кулак пляж песок победа", cat: "all", url: "https://i.imgflip.com/1bhk.jpg" }
    ];

    // Фоновая подгрузка еще 100 мировых мемов из Imgflip API
    fetch("https://api.imgflip.com/get_memes")
      .then(res => res.json())
      .then(data => {
        if (data?.data?.memes) {
          const apiMemes = data.data.memes.map(m => ({
            id: "if_" + m.id,
            title: m.name,
            tags: m.name.toLowerCase(),
            cat: "all",
            url: m.url
          }));
          // Объединяем, исключая дубликаты
          const existingUrls = new Set(allTemplates.map(t => t.url));
          apiMemes.forEach(m => {
            if (!existingUrls.has(m.url)) {
              allTemplates.push(m);
            }
          });
        }
      })
      .catch(() => {});

    const canvas = document.getElementById("memeCanvas");
    const ctx = canvas.getContext("2d");

    const textInput = document.getElementById("memeText");
    const fontSelect = document.getElementById("fontSelect");
    const fontSizeSlider = document.getElementById("fontSize");
    const sizeVal = document.getElementById("sizeVal");
    const colorPicker = document.getElementById("colorPicker");
    const btnStroke = document.getElementById("btnStroke");
    const btnPlate = document.getElementById("btnPlate");
    const btnUpper = document.getElementById("btnUpper");
    const btnSubmit = document.getElementById("btnSubmit");
    const templatesBar = document.getElementById("templatesBar");
    const fileInput = document.getElementById("fileInput");
    const searchBar = document.getElementById("searchBar");
    const tagElements = document.querySelectorAll(".tag");

    let currentImage = new Image();

    const urlParams = new URLSearchParams(window.location.search);
    const passedImg = urlParams.get("img");
    const passedText = urlParams.get("text");
    const passedQuery = urlParams.get("q");
    const passedPics = urlParams.get("pics");

    if (passedText) textInput.value = passedText;
    if (passedQuery) searchBar.value = passedQuery;

    let initialUrl = passedImg;

    // Распаковка найденных картинок из Telegram бота (Яндекс + Bing)
    if (passedPics) {
      try {
        const jsonStr = atob(passedPics.replace(/-/g, "+").replace(/_/g, "/"));
        const decoded = JSON.parse(jsonStr);
        if (Array.isArray(decoded) && decoded.length > 0) {
          const liveMemes = decoded.map((u, i) => ({
            id: "live_" + i,
            title: passedQuery ? `${passedQuery} #${i + 1}` : `Найдено #${i + 1}`,
            tags: (passedQuery || "") + " яндекс bing поиск",
            cat: "all",
            url: u,
          }));
          // Ставим найденные картинки на САМОЕ ПЕРВОЕ МЕСТО!
          allTemplates = liveMemes.concat(allTemplates);
          if (!initialUrl) initialUrl = liveMemes[0].url;
        }
      } catch (err) {
        console.warn("Could not unpack pics:", err);
      }
    }

    if (!initialUrl) initialUrl = allTemplates[0].url;

    let state = {
      text: textInput.value,
      font: "Impact",
      size: 38,
      color: "#ffffff",
      stroke: true,
      plate: false,
      uppercase: true,
      posX: null,
      posY: null,
      imgUrl: initialUrl,
    };

    let isDragging = false;

    function renderTemplates(list) {
      templatesBar.innerHTML = "";
      if (!list.length) {
        templatesBar.innerHTML = `<div class="no-results">Ничего не найдено 😢 Попробуй другое слово (например: кот, собака, дрейк, мозг, работа)</div>`;
        return;
      }
      list.forEach((item) => {
        const img = document.createElement("img");
        img.className = "thumb" + (item.url === state.imgUrl ? " active" : "");
        
        // Надежная загрузка миниатюры
        let thumbUrl = item.url;
        if (thumbUrl.includes("pikabu.ru") || thumbUrl.includes("vk.com") || thumbUrl.includes("rutube.ru") || thumbUrl.includes("faceit-cdn")) {
          thumbUrl = "https://images.weserv.nl/?url=" + encodeURIComponent(thumbUrl) + "&w=130&h=130&fit=cover";
        }
        img.src = thumbUrl;
        img.onerror = () => {
          if (!img.src.includes("weserv.nl")) {
            img.src = "https://images.weserv.nl/?url=" + encodeURIComponent(item.url) + "&w=130&h=130&fit=cover";
          }
        };

        img.title = item.title;
        img.addEventListener("click", () => {
          document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
          img.classList.add("active");
          state.imgUrl = item.url;
          loadImage(item.url);
        });
        templatesBar.appendChild(img);
      });
    }

    renderTemplates(allTemplates);

    function filterMemes() {
      const q = searchBar.value.toLowerCase().trim();
      const activeTag = document.querySelector(".tag.active")?.dataset.tag || "all";

      let filtered = allTemplates;

      if (activeTag !== "all") {
        filtered = filtered.filter(t => t.cat === activeTag);
      }

      if (q) {
        // Если пользователь вставил прямую ссылку на картинку
        if (q.startsWith("http://") || q.startsWith("https://")) {
          loadImage(q);
          return;
        }

        const words = q.split(" ").filter(Boolean);
        filtered = filtered.filter(t => {
          const hay = (t.title + " " + (t.tags || "")).toLowerCase();
          return words.some(w => hay.includes(w));
        });
      }

      renderTemplates(filtered);
    }

    searchBar.addEventListener("input", filterMemes);

    tagElements.forEach(tag => {
      tag.addEventListener("click", () => {
        tagElements.forEach(t => t.classList.remove("active"));
        tag.classList.add("active");
        filterMemes();
      });
    });

    function getSafeImageUrl(url) {
      if (!url) return "";
      if (url.startsWith("data:") || url.startsWith("blob:")) return url;
      if (url.startsWith("https://images.weserv.nl/")) return url;
      return "https://images.weserv.nl/?url=" + encodeURIComponent(url);
    }

    function loadImage(url) {
      const safeUrl = getSafeImageUrl(url);
      currentImage = new Image();
      if (!url.startsWith("data:") && !url.startsWith("blob:")) {
        currentImage.crossOrigin = "anonymous";
      }
      currentImage.onload = () => {
        canvas.width = currentImage.naturalWidth || 600;
        canvas.height = currentImage.naturalHeight || 400;
        state.posX = canvas.width / 2;
        state.posY = canvas.height - 45;
        render();
      };
      currentImage.onerror = () => {
        if (currentImage.src !== url) {
          const directImg = new Image();
          directImg.onload = () => {
            currentImage = directImg;
            canvas.width = currentImage.naturalWidth || 600;
            canvas.height = currentImage.naturalHeight || 400;
            state.posX = canvas.width / 2;
            state.posY = canvas.height - 45;
            render();
          };
          directImg.src = url;
        }
      };
      currentImage.src = safeUrl;
    }

    loadImage(state.imgUrl);

    // Загрузка собственного фото с устройства
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        loadImage(evt.target.result);
      };
      reader.readAsDataURL(file);
    });

    function wrapText(context, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = context.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function render() {
      if (!currentImage.complete) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      let textToDraw = state.uppercase ? state.text.toUpperCase() : state.text;
      if (!textToDraw.trim()) return;

      const fontStr = `bold ${state.size}px "${state.font}", Impact, Arial, sans-serif`;
      ctx.font = fontStr;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const maxTextWidth = canvas.width * 0.9;
      const lines = wrapText(ctx, textToDraw, maxTextWidth);
      const lineHeight = state.size * 1.18;
      const totalBlockHeight = lines.length * lineHeight;

      if (state.plate) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        const padY = 12;
        const plateY = state.posY - totalBlockHeight / 2 - padY;
        ctx.beginPath();
        ctx.roundRect(canvas.width * 0.05, plateY, canvas.width * 0.9, totalBlockHeight + padY * 2, 10);
        ctx.fill();
        ctx.restore();
      }

      const startY = state.posY - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, index) => {
        const y = startY + index * lineHeight;

        if (state.stroke) {
          ctx.strokeStyle = state.color === "#111111" ? "#ffffff" : "#000000";
          ctx.lineWidth = Math.max(3, state.size / 10);
          ctx.lineJoin = "round";
          ctx.strokeText(line, state.posX, y);
        }

        ctx.fillStyle = state.color;
        ctx.fillText(line, state.posX, y);
      });
    }

    textInput.addEventListener("input", (e) => {
      state.text = e.target.value;
      render();
    });

    fontSelect.addEventListener("change", (e) => {
      state.font = e.target.value;
      render();
    });

    fontSizeSlider.addEventListener("input", (e) => {
      state.size = parseInt(e.target.value);
      sizeVal.textContent = state.size + "px";
      render();
    });

    colorPicker.addEventListener("click", (e) => {
      const dot = e.target.closest(".color-dot");
      if (!dot) return;
      document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
      dot.classList.add("active");
      state.color = dot.dataset.color;
      render();
    });

    btnStroke.addEventListener("click", () => {
      state.stroke = !state.stroke;
      btnStroke.classList.toggle("active", state.stroke);
      render();
    });

    btnPlate.addEventListener("click", () => {
      state.plate = !state.plate;
      btnPlate.classList.toggle("active", state.plate);
      render();
    });

    btnUpper.addEventListener("click", () => {
      state.uppercase = !state.uppercase;
      btnUpper.classList.toggle("active", state.uppercase);
      render();
    });

    function getCanvasCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY,
      };
    }

    function onDragStart(e) {
      isDragging = true;
      const coords = getCanvasCoords(e);
      state.posX = coords.x;
      state.posY = coords.y;
      render();
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const coords = getCanvasCoords(e);
      state.posX = coords.x;
      state.posY = coords.y;
      render();
    }

    function onDragEnd() {
      isDragging = false;
    }

    canvas.addEventListener("mousedown", onDragStart);
    window.addEventListener("mousemove", onDragMove);
    window.addEventListener("mouseup", onDragEnd);

    canvas.addEventListener("touchstart", onDragStart, { passive: false });
    window.addEventListener("touchmove", onDragMove, { passive: false });
    window.addEventListener("touchend", onDragEnd);

    async function getCanvasBlob() {
      return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
    }

    function downloadCanvasBlob(blob) {
      try {
        const link = document.createElement("a");
        link.download = "meme_" + Date.now() + ".png";
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 5000);
      } catch (e) {
        console.warn("Download failed:", e);
      }
    }

    // Управление окном «Поделиться»
    const shareModal = document.getElementById("shareModal");
    const shareCloseBtn = document.getElementById("shareCloseBtn");
    const shareToast = document.getElementById("shareToast");
    let toastTimeout = null;

    function showToast(msg) {
      if (!shareToast) return;
      shareToast.textContent = msg;
      shareToast.style.display = "block";
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        shareToast.style.display = "none";
      }, 3500);
    }

    function openShareModal() {
      if (shareModal) shareModal.classList.add("active");
    }

    function closeShareModal() {
      if (shareModal) shareModal.classList.remove("active");
    }

    if (shareCloseBtn) {
      shareCloseBtn.addEventListener("click", closeShareModal);
    }
    if (shareModal) {
      shareModal.addEventListener("click", (e) => {
        if (e.target === shareModal) closeShareModal();
      });
    }

    // Главная кнопка в редакторе открывает красивое меню «Поделиться»
    btnSubmit.addEventListener("click", () => {
      openShareModal();
    });

    // 1. Иконка Telegram
    document.getElementById("shareTgBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (!blob) return;

      const memeFile = new File([blob], "meme.png", { type: "image/png" });

      // На смартфоне (Android / iPhone) открываем системный шеринг
      if (navigator.share && (navigator.canShare?.({ files: [memeFile] }) ?? true)) {
        try {
          await navigator.share({ files: [memeFile], title: "Мем" });
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
        }
      }

      // На ПК (Telegram Desktop) — копируем мем в буфер обмена для мгновенной вставки Ctrl+V
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast("✅ Мем скопирован! Нажми Ctrl + V в чате");
          return;
        } catch (e) {}
      }

      downloadCanvasBlob(blob);
      showToast("💾 Мем скачан! Перетащи его в чат Telegram");
    });

    // 2. Иконка WhatsApp
    document.getElementById("shareWaBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (blob) downloadCanvasBlob(blob);
      showToast("✅ Мем скачан! Открываю WhatsApp...");
      setTimeout(() => {
        window.open("https://web.whatsapp.com", "_blank");
      }, 800);
    });

    // 3. Иконка VK
    document.getElementById("shareVkBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (blob) downloadCanvasBlob(blob);
      showToast("✅ Мем скачан! Открываю VK...");
      setTimeout(() => {
        window.open("https://vk.com/im", "_blank");
      }, 800);
    });

    // 4. Иконка Viber
    document.getElementById("shareViberBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (blob) downloadCanvasBlob(blob);
      showToast("✅ Мем скачан! Открываю Viber...");
      setTimeout(() => {
        window.open("viber://forward", "_blank");
      }, 800);
    });

    // 5. Иконка «Еще» (системное меню смартфона)
    document.getElementById("shareSystemBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (!blob) return;
      const memeFile = new File([blob], "meme.png", { type: "image/png" });
      if (navigator.share) {
        try {
          await navigator.share({ files: [memeFile], title: "Мем" });
          return;
        } catch (e) {
          if (e.name === "AbortError") return;
        }
      }
      downloadCanvasBlob(blob);
      showToast("💾 Файл скачан на устройство");
    });

    // Кнопка: 📋 Скопировать картинку
    document.getElementById("shareCopyImgBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (!blob) return;

      if (navigator.clipboard && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast("✅ Скопировано в буфер! Вставь через Ctrl + V");
          return;
        } catch (e) {}
      }

      downloadCanvasBlob(blob);
      showToast("💾 Файл скачан (буфер недоступен)");
    });

    // Кнопка: 💾 Скачать мем
    document.getElementById("shareDownloadBtn").addEventListener("click", async () => {
      const blob = await getCanvasBlob();
      if (blob) {
        downloadCanvasBlob(blob);
        showToast("✅ Мем сохранен на устройство!");
      }
    });

    // Кнопка: 🤖 Отправить через бота в чат
    document.getElementById("shareBotBtn").addEventListener("click", () => {
      const payload = {
        action: "send_meme",
        text: state.text,
        font: state.font,
        size: state.size,
        color: state.color,
        stroke: state.stroke,
        plate: state.plate,
        uppercase: state.uppercase,
        posX_rel: state.posX != null ? state.posX / canvas.width : 0.5,
        posY_rel: state.posY != null ? state.posY / canvas.height : 0.85,
        img_url: state.imgUrl,
      };
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        const btn = document.getElementById("shareDownloadBtn");
        if (btn) btn.click();
      }
    });

    // Кнопка «Скачать файл» на главном экране редактора
    const btnDownload = document.getElementById("btnDownload");
    if (btnDownload) {
      btnDownload.addEventListener("click", async () => {
        const blob = await getCanvasBlob();
        if (blob) {
          downloadCanvasBlob(blob);
          const orig = btnDownload.textContent;
          btnDownload.textContent = "✅ Скачано!";
          setTimeout(() => { btnDownload.textContent = orig; }, 2000);
        }
      });
    }
  </script>
</body>
</html>
