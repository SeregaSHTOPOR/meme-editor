<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Редактор мемов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Lobster&family=Montserrat:wght@800&family=Pacifico&family=Roboto:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--tg-theme-secondary-bg-color, #222222);
      color: var(--tg-theme-text-color, #fff);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
    .upload-btn {
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .tags-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tags-bar::-webkit-scrollbar {
      display: none;
    }
    .tag {
      padding: 4px 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      color: #bbb;
      user-select: none;
    }
    .tag.active {
      background: var(--tg-theme-button-color, #2481cc);
      color: #fff;
    }
    .templates-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      min-height: 64px;
    }
    .templates-bar::-webkit-scrollbar {
      display: none;
    }
    .thumb {
      width: 62px;
      height: 62px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      background: #2a2a2a;
      transition: transform 0.15s, border-color 0.15s;
    }
    .thumb.active {
      border-color: var(--tg-theme-button-color, #2481cc);
      transform: scale(1.06);
    }
    .no-results {
      font-size: 12px;
      color: #888;
      padding: 10px 4px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    canvas {
      max-width: 100%;
      max-height: 48vh;
      display: block;
      touch-action: none;
      cursor: move;
    }
    .drag-hint {
      text-align: center;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #888);
      margin-top: -4px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--tg-theme-secondary-bg-color, #202020);
      padding: 12px 14px;
      border-radius: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tg-theme-hint-color, #999);
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #fff);
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select {
      flex: 1.2;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--tg-theme-bg-color, #141414);
      color: var(--tg-theme-text-color, #fff);
      font-size: 13px;
      outline: none;
    }
    .color-picker {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .color-dot.active {
      border-color: #fff;
      transform: scale(1.18);
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--tg-theme-button-color, #2481cc);
    }
    .toggles-row {
      display: flex;
      gap: 6px;
    }
    .toggle-btn {
      flex: 1;
      padding: 7px 4px;
      background: var(--tg-theme-bg-color, #141414);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #ccc;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .toggle-btn.active {
      background: var(--tg-theme-button-color, #2481cc);
      border-color: var(--tg-theme-button-color, #2481cc);
      color: #fff;
    }
    .main-btn {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(36, 129, 204, 0.4);
      margin-top: 2px;
    }
    .main-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Поиск и загрузка фото -->
    <div class="header-bar">
      <input type="text" class="search-input" id="searchBar" placeholder="🔎 Ищи: кот, собака, дрейк, работа...">
      <label class="upload-btn" for="fileInput">📁 Своё фото</label>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <!-- Быстрые теги тем -->
    <div class="tags-bar">
      <div class="tag active" data-tag="all">🔥 Все популярные</div>
      <div class="tag" data-tag="cat">🐱 Коты</div>
      <div class="tag" data-tag="dog">🐶 Доге</div>
      <div class="tag" data-tag="choice">🎭 Выбор / Дрейк</div>
      <div class="tag" data-tag="think">🧠 Мысли / Сверхразум</div>
      <div class="tag" data-tag="work">💼 Работа / IT</div>
      <div class="tag" data-tag="sad">😭 Боль / Грусть</div>
    </div>

    <!-- Лента миниатюр мемов -->
    <div class="templates-bar" id="templatesBar"></div>

    <!-- Холст редактора -->
    <div class="canvas-wrapper">
      <canvas id="memeCanvas"></canvas>
    </div>
    <div class="drag-hint">👆 Перетаскивай надпись пальцем или мышкой прямо по картинке!</div>

    <!-- Пульт настроек текста -->
    <div class="controls">
      <div class="input-group">
        <label>Текст на меме (со смайликами 😂🔥)</label>
        <input type="text" id="memeText" placeholder="Введи текст мема..." value="КОГДА ВСЁ РАБОТАЕТ ИДЕАЛЬНО 🔥">
      </div>

      <div class="row">
        <div class="input-group" style="flex: 1.2;">
          <label>Шрифт</label>
          <select id="fontSelect">
            <option value="Impact" selected>Impact (Мемы)</option>
            <option value="Montserrat">Montserrat (Жирный)</option>
            <option value="Comic Neue">Comic Sans (Юмор)</option>
            <option value="Lobster">Lobster (Красивый)</option>
            <option value="Pacifico">Pacifico (Элегантный)</option>
            <option value="Times New Roman">Times (Классика)</option>
            <option value="Roboto">Roboto (Чистый)</option>
          </select>
        </div>
        <div class="input-group" style="flex: 1;">
          <label>Размер: <span id="sizeVal">38px</span></label>
          <input type="range" id="fontSize" min="18" max="95" value="38">
        </div>
      </div>

      <div class="input-group">
        <label>Цвет текста</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
          <div class="color-dot" style="background: #ffeb00;" data-color="#ffeb00"></div>
          <div class="color-dot" style="background: #ff3b30;" data-color="#ff3b30"></div>
          <div class="color-dot" style="background: #34c759;" data-color="#34c759"></div>
          <div class="color-dot" style="background: #00c7be;" data-color="#00c7be"></div>
          <div class="color-dot" style="background: #af52de;" data-color="#af52de"></div>
          <div class="color-dot" style="background: #111111; border: 1px solid #666;" data-color="#111111"></div>
        </div>
      </div>

      <div class="toggles-row">
        <div class="toggle-btn active" id="btnStroke">🔲 Контур</div>
        <div class="toggle-btn" id="btnPlate">🏷 Плашка</div>
        <div class="toggle-btn active" id="btnUpper">🔠 КАПС</div>
      </div>

      <button class="main-btn" id="btnSubmit">🚀 Отправить готовый мем</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Богатая встроенная база шаблонов с русскими поисковыми тегами
    let allTemplates = [
      // Коты и животные
      { id: "cat_rybov", title: "Вы продаете рыбов", tags: "рыбов кот коты котик рыба продаете кошка", cat: "cat", url: "https://i.imgflip.com/1g8my4.jpg" },
      { id: "cat_woman", title: "Женщина кричит на кота за столом", tags: "кот кошка стол женщина кричит белая салат орет", cat: "cat", url: "https://i.imgflip.com/345v97.jpg" },
      { id: "cat_sad", title: "Грустный плачущий котик", tags: "кот котик плачет слезы грусть печаль", cat: "cat", url: "https://i.imgflip.com/46hhvr.jpg" },
      { id: "doge", title: "Доге (Doge)", tags: "доге собака пес пёс сиба ину мем классика", cat: "dog", url: "https://i.imgflip.com/4t0m5.jpg" },
      { id: "buff_doge", title: "Качок Доге и Чимс", tags: "доге чимс собака качок раньше сейчас сравнение слабый сильный", cat: "dog", url: "https://i.imgflip.com/43a45p.jpg" },
      { id: "this_is_fine", title: "Собака в огне (This is fine)", tags: "собака огонь пожар все нормально пёс чай кофе", cat: "dog", url: "https://i.imgflip.com/wxica.jpg" },

      // Выбор и реакции
      { id: "drake", title: "Дрейк (Drake)", tags: "дрейк выбор нет да одобряет отвергает рэпер", cat: "choice", url: "https://i.imgflip.com/30b1gx.jpg" },
      { id: "two_buttons", title: "Две кнопки (Сложный выбор)", tags: "две кнопки выбор паника пот человек мужик красная", cat: "choice", url: "https://i.imgflip.com/1g8my4.jpg" },
      { id: "distracted_bf", title: "Парень оглянулся на девушку", tags: "парень девушка измена оглянулся платье свидание", cat: "choice", url: "https://i.imgflip.com/1ur9b0.jpg" },
      { id: "monkey_puppet", title: "Обезьяна отвернулась", tags: "обезьяна отвернулся стыдно неловко глаза взгляд в сторону", cat: "choice", url: "https://i.imgflip.com/2gnnjh.jpg" },

      // Мысли, ум, работа
      { id: "rollsafe", title: "Думающий парень (Roll Safe)", tags: "думает умный мысль палец у виска голова соображает гений", cat: "think", url: "https://i.imgflip.com/1h7in3.jpg" },
      { id: "expanding_brain", title: "Сверхразум (Расширение мозга)", tags: "мозг мысли сверхразум уровни космос идея", cat: "think", url: "https://i.imgflip.com/1jwhww.jpg" },
      { id: "change_my_mind", title: "Измени мое мнение (Change My Mind)", tags: "стол кофе кружка парк докажи мнение спор", cat: "think", url: "https://i.imgflip.com/24y43o.jpg" },
      { id: "office_same", title: "Найди отличия (The Office)", tags: "офис найди отличия они одинаковые одно и то же девушка", cat: "work", url: "https://i.imgflip.com/2ybua0.jpg" },
      { id: "computer_angry", title: "Злой за компом / Программист", tags: "программист код комп компьютер злой клавиатура работа офис", cat: "work", url: "https://i.imgflip.com/261o3j.jpg" },

      // Эмоции
      { id: "dicaprio", title: "Леонардо Ди Каприо с бокалом", tags: "ди каприо тост бокал вино гэтсби ухмылка праздник", cat: "all", url: "https://i.imgflip.com/39t1o.jpg" },
      { id: "disaster_girl", title: "Девочка на фоне пожара", tags: "девочка пожар улыбка огонь злодейка дом горит", cat: "all", url: "https://i.imgflip.com/23ls.jpg" },
      { id: "pablo_escobar", title: "Ожидающий Пабло Эскобар", tags: "пабло эскобар ждет скучно ожидание тоска один сидит", cat: "sad", url: "https://i.imgflip.com/1c1uej.jpg" },
      { id: "clown", title: "Клоун красится", tags: "клоун макияж цирк дебил дурак позор", cat: "all", url: "https://i.imgflip.com/38el31.jpg" },
      { id: "gigachad", title: "Гигачад (Gigachad)", tags: "гигачад сигма скуф мужик челюсть красивый сила", cat: "all", url: "https://i.imgflip.com/65x7uh.jpg" },
      { id: "batman_slap", title: "Бэтмен бьет Робина", tags: "бэтмен робин пощечина заткнись удар комикс", cat: "all", url: "https://i.imgflip.com/9ehk.jpg" },
      { id: "grumpy_cat", title: "Сердитый кот (Grumpy Cat)", tags: "сердитый кот злой недовольный морда", cat: "cat", url: "https://i.imgflip.com/8p0a.jpg" },
      { id: "success_kid", title: "Успешный ребенок (Success Kid)", tags: "успех ребенок кулак пляж песок победа", cat: "all", url: "https://i.imgflip.com/1bhk.jpg" }
    ];

    // Фоновая подгрузка еще 100 мировых мемов из Imgflip API
    fetch("https://api.imgflip.com/get_memes")
      .then(res => res.json())
      .then(data => {
        if (data?.data?.memes) {
          const apiMemes = data.data.memes.map(m => ({
            id: "if_" + m.id,
            title: m.name,
            tags: m.name.toLowerCase(),
            cat: "all",
            url: m.url
          }));
          // Объединяем, исключая дубликаты
          const existingUrls = new Set(allTemplates.map(t => t.url));
          apiMemes.forEach(m => {
            if (!existingUrls.has(m.url)) {
              allTemplates.push(m);
            }
          });
        }
      })
      .catch(() => {});

    const canvas = document.getElementById("memeCanvas");
    const ctx = canvas.getContext("2d");

    const textInput = document.getElementById("memeText");
    const fontSelect = document.getElementById("fontSelect");
    const fontSizeSlider = document.getElementById("fontSize");
    const sizeVal = document.getElementById("sizeVal");
    const colorPicker = document.getElementById("colorPicker");
    const btnStroke = document.getElementById("btnStroke");
    const btnPlate = document.getElementById("btnPlate");
    const btnUpper = document.getElementById("btnUpper");
    const btnSubmit = document.getElementById("btnSubmit");
    const templatesBar = document.getElementById("templatesBar");
    const fileInput = document.getElementById("fileInput");
    const searchBar = document.getElementById("searchBar");
    const tagElements = document.querySelectorAll(".tag");

    let currentImage = new Image();
    currentImage.crossOrigin = "anonymous";

    const urlParams = new URLSearchParams(window.location.search);
    const passedImg = urlParams.get("img");
    const passedText = urlParams.get("text");
    const passedQuery = urlParams.get("q");

    if (passedText) textInput.value = passedText;
    if (passedQuery) searchBar.value = passedQuery;

    let state = {
      text: textInput.value,
      font: "Impact",
      size: 38,
      color: "#ffffff",
      stroke: true,
      plate: false,
      uppercase: true,
      posX: null,
      posY: null,
      imgUrl: passedImg || allTemplates[0].url,
    };

    let isDragging = false;

    function renderTemplates(list) {
      templatesBar.innerHTML = "";
      if (!list.length) {
        templatesBar.innerHTML = `<div class="no-results">Ничего не найдено 😢 Попробуй другое слово (например: кот, собака, дрейк, мозг, работа)</div>`;
        return;
      }
      list.forEach((item) => {
        const img = document.createElement("img");
        img.className = "thumb" + (item.url === state.imgUrl ? " active" : "");
        img.src = item.url;
        img.title = item.title;
        img.addEventListener("click", () => {
          document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
          img.classList.add("active");
          state.imgUrl = item.url;
          loadImage(item.url);
        });
        templatesBar.appendChild(img);
      });
    }

    renderTemplates(allTemplates);

    function filterMemes() {
      const q = searchBar.value.toLowerCase().trim();
      const activeTag = document.querySelector(".tag.active")?.dataset.tag || "all";

      let filtered = allTemplates;

      if (activeTag !== "all") {
        filtered = filtered.filter(t => t.cat === activeTag);
      }

      if (q) {
        // Если пользователь вставил прямую ссылку на картинку
        if (q.startsWith("http://") || q.startsWith("https://")) {
          loadImage(q);
          return;
        }

        const words = q.split(" ").filter(Boolean);
        filtered = filtered.filter(t => {
          const hay = (t.title + " " + (t.tags || "")).toLowerCase();
          return words.some(w => hay.includes(w));
        });
      }

      renderTemplates(filtered);
    }

    searchBar.addEventListener("input", filterMemes);

    tagElements.forEach(tag => {
      tag.addEventListener("click", () => {
        tagElements.forEach(t => t.classList.remove("active"));
        tag.classList.add("active");
        filterMemes();
      });
    });

    function loadImage(url) {
      currentImage = new Image();
      currentImage.crossOrigin = "anonymous";
      currentImage.onload = () => {
        canvas.width = currentImage.naturalWidth || 600;
        canvas.height = currentImage.naturalHeight || 400;
        state.posX = canvas.width / 2;
        state.posY = canvas.height - 45;
        render();
      };
      currentImage.onerror = () => {
        alert("Не удалось загрузить эту картинку (возможно ограничение сайта). Попробуй другую!");
      };
      currentImage.src = url;
    }

    loadImage(state.imgUrl);

    // Загрузка собственного фото с устройства
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        loadImage(evt.target.result);
      };
      reader.readAsDataURL(file);
    });

    function wrapText(context, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = context.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function render() {
      if (!currentImage.complete) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      let textToDraw = state.uppercase ? state.text.toUpperCase() : state.text;
      if (!textToDraw.trim()) return;

      const fontStr = `bold ${state.size}px "${state.font}", Impact, Arial, sans-serif`;
      ctx.font = fontStr;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const maxTextWidth = canvas.width * 0.9;
      const lines = wrapText(ctx, textToDraw, maxTextWidth);
      const lineHeight = state.size * 1.18;
      const totalBlockHeight = lines.length * lineHeight;

      if (state.plate) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        const padY = 12;
        const plateY = state.posY - totalBlockHeight / 2 - padY;
        ctx.beginPath();
        ctx.roundRect(canvas.width * 0.05, plateY, canvas.width * 0.9, totalBlockHeight + padY * 2, 10);
        ctx.fill();
        ctx.restore();
      }

      const startY = state.posY - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, index) => {
        const y = startY + index * lineHeight;

        if (state.stroke) {
          ctx.strokeStyle = state.color === "#111111" ? "#ffffff" : "#000000";
          ctx.lineWidth = Math.max(3, state.size / 10);
          ctx.lineJoin = "round";
          ctx.strokeText(line, state.posX, y);
        }

        ctx.fillStyle = state.color;
        ctx.fillText(line, state.posX, y);
      });
    }

    textInput.addEventListener("input", (e) => {
      state.text = e.target.value;
      render();
    });

    fontSelect.addEventListener("change", (e) => {
      state.font = e.target.value;
      render();
    });

    fontSizeSlider.addEventListener("input", (e) => {
      state.size = parseInt(e.target.value);
      sizeVal.textContent = state.size + "px";
      render();
    });

    colorPicker.addEventListener("click", (e) => {
      const dot = e.target.closest(".color-dot");
      if (!dot) return;
      document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
      dot.classList.add("active");
      state.color = dot.dataset.color;
      render();
    });

    btnStroke.addEventListener("click", () => {
      state.stroke = !state.stroke;
      btnStroke.classList.toggle("active", state.stroke);
      render();
    });

    btnPlate.addEventListener("click", () => {
      state.plate = !state.plate;
      btnPlate.classList.toggle("active", state.plate);
      render();
    });

    btnUpper.addEventListener("click", () => {
      state.uppercase = !state.uppercase;
      btnUpper.classList.toggle("active", state.uppercase);
      render();
    });

    function getCanvasCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY,
      };
    }

    function onDragStart(e) {
      isDragging = true;
      const coords = getCanvasCoords(e);
      state.posX = coords.x;
      state.posY = coords.y;
      render();
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const coords = getCanvasCoords(e);
      state.posX = coords.x;
      state.posY = coords.y;
      render();
    }

    function onDragEnd() {
      isDragging = false;
    }

    canvas.addEventListener("mousedown", onDragStart);
    window.addEventListener("mousemove", onDragMove);
    window.addEventListener("mouseup", onDragEnd);

    canvas.addEventListener("touchstart", onDragStart, { passive: false });
    window.addEventListener("touchmove", onDragMove, { passive: false });
    window.addEventListener("touchend", onDragEnd);

    btnSubmit.addEventListener("click", () => {
      const payload = {
        action: "send_meme",
        text: state.text,
        font: state.font,
        size: state.size,
        color: state.color,
        stroke: state.stroke,
        plate: state.plate,
        uppercase: state.uppercase,
        posX_rel: state.posX / canvas.width,
        posY_rel: state.posY / canvas.height,
        img_url: state.imgUrl,
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Вне Telegram: мем успешно сгенерирован!");
      }
    });
  </script>
</body>
</html>
